name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `prepare` builds the package, so dist/ exists for every later step.
      - run: npm ci

      # Enforces the ground rules in docs/RULES.md. A rule CI does not run is
      # a suggestion.
      - name: Rule lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The generated token files are committed. If regenerating them produces
      # a diff, someone hand-edited generated CSS or changed the generator
      # without re-running it.
      - name: Tokens are up to date
        run: |
          npm run tokens
          git diff --exit-code -- src/styles/tokens/ \
            || (echo "::error::Token CSS is stale. Run 'npm run tokens' and commit the result." && exit 1)

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No system Chromium here, so playwright.config.ts falls back to
      # Playwright's own managed browser.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Visual regression
        run: npm run test:visual

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
