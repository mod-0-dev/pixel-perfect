name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `prepare` builds the package, so dist/ exists for every later step.
      - run: npm ci

      # Enforces the ground rules in docs/RULES.md. A rule CI does not run is
      # a suggestion.
      - name: Rule lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The generated token files are committed. If regenerating them produces
      # a diff, someone hand-edited generated CSS or changed the generator
      # without re-running it.
      - name: Tokens are up to date
        run: |
          npm run tokens
          git diff --exit-code -- src/styles/tokens/ \
            || (echo "::error::Token CSS is stale. Run 'npm run tokens' and commit the result." && exit 1)

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checks out the branch itself rather than the PR merge commit, so this
      # job can commit authored baselines back to it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The playground is not a workspace member — see D-012 — so it installs
      # separately.
      - run: npm --prefix playground ci

      # No system Chromium here, so playwright.config.ts falls back to
      # Playwright's own managed browser.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Baselines are authored HERE and nowhere else. A screenshot depends on
      # the exact Chromium build, and the runner image pins one that a given
      # dev container will not have. Baselines generated anywhere else are
      # guaranteed to mismatch. See D-013.
      #
      # Compare first. Playwright writes the actual image for any test whose
      # baseline is missing and fails that test, so a run that fails ONLY
      # because new files appeared under __screenshots__ is a new test asking
      # for a baseline, not a regression. A run in which an existing baseline
      # differs is a regression and stays red. See D-017.
      - name: Visual regression
        id: visual
        run: npm run test:visual
        continue-on-error: true

      - name: Classify the result
        id: classify
        run: |
          changed=$(git status --porcelain -- tests/visual/__screenshots__ | grep -v '^??' || true)
          new=$(git status --porcelain -- tests/visual/__screenshots__ | grep '^??' || true)
          echo "changed=$([ -n "$changed" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "new=$([ -n "$new" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ -n "$changed" ]; then
            echo "::error::Existing screenshot baselines differ — this is a visual regression."
            echo "$changed"
          fi

      # Authoring happens on a PR branch and nowhere else. A push to `main`
      # cannot do it — the branch is protected, so this `git push` is rejected
      # by policy (GH006) and the job dies at its last step with everything
      # upstream green, which is the D-038 shape precisely. The event is
      # therefore checked rather than the push attempted and left to fail.
      #
      # A push made with GITHUB_TOKEN does not trigger another workflow run, by
      # design, so this commit lands with no checks of its own. The baselines
      # are therefore authored but not yet COMPARED; the next real push
      # verifies them. That is the intended shape — it is what stops an
      # authoring run from looping forever — but it does mean an
      # authoring commit should never be the final head of a PR, and nothing
      # here can enforce that. See D-042.
      - name: Commit authored baselines
        if: >-
          github.event_name == 'pull_request'
          && steps.classify.outputs.new == 'true'
          && steps.classify.outputs.changed == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          git commit -m "test(visual): author screenshot baselines in CI"
          git push

      # On `main`, a missing baseline is not a request for authoring. It means a
      # component reached the default branch with its "visual regression
      # snapshots committed" box unmet — which is how `Input` shipped in v0.2.0
      # with no baseline (D-042). Say that, and name the file.
      - name: A baseline is missing on main
        if: github.event_name != 'pull_request' && steps.classify.outputs.new == 'true'
        run: |
          echo "::error::A screenshot baseline is missing on ${{ github.ref_name }} and cannot be authored here, because the branch is protected. It was never authored on the PR branch. Land it through a pull request."
          git status --porcelain -- tests/visual/__screenshots__ | grep '^??' || true
          exit 1

      - name: Fail on regression
        if: steps.visual.outcome == 'failure' && (steps.classify.outputs.changed == 'true' || steps.classify.outputs.new == 'false')
        run: exit 1

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
