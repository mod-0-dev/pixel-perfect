name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing: the publish authenticates with this workflow's
  # OIDC identity instead of a long-lived token, and gets provenance.
  id-token: write

concurrency: release-${{ github.ref }}

jobs:
  release:
    name: Version or release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `pixel-perfect` is somebody else's name on npm, so a publish under it
      # is refused — at the very last step, after everything upstream went
      # green, which is how D-038's five silent failures looked. Say so first.
      - name: The package name can be published
        if: ${{ vars.PUBLISH_TO_NPM == 'true' }}
        run: |
          name=$(node -p "require('./package.json').name")
          if [ "$name" = "pixel-perfect" ]; then
            echo "::error::'pixel-perfect' is taken on npm by an unrelated package; a publish would be refused. Rename to a scope you own (for example @mod-0-dev/pixel-perfect) first. See docs/RELEASING.md."
            exit 1
          fi

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: npm that can publish with OIDC
        if: ${{ vars.PUBLISH_TO_NPM == 'true' }}
        run: npm install -g npm@^11.5.1

      # Opens or updates a "Version Packages" PR while changesets are pending.
      # When that PR merges there are none left, and this releases.
      #
      # Publishing to npm is opt-in: set the repository variable
      # PUBLISH_TO_NPM=true, after the first publish and with this workflow
      # registered as the package's trusted publisher on npmjs.com. Without it
      # the repo still gets versions, a CHANGELOG and git tags, which is all a
      # git dependency needs. An NPM_TOKEN secret, if set, is used instead of
      # OIDC. See docs/RELEASING.md.
      - name: Changesets
        id: changesets
        uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: ${{ vars.PUBLISH_TO_NPM == 'true' && 'npx changeset publish' || '' }}
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A git dependency pinned by semver range needs tags to resolve. Without a
      # publish step nothing tags the release; with one, `changeset publish`
      # tags it in this checkout but changesets/action v1 never pushes the tag,
      # because it looks for a "New tag:" line that @changesets/cli 3 no longer
      # prints (v0.12.0, the first publish, went out untagged). `changeset tag`
      # skips tags that exist, so this is the same step either way.
      - name: Tag release
        if: ${{ steps.changesets.outputs.hasChangesets == 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npx changeset tag
          git push --follow-tags
