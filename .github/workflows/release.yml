name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency: release-${{ github.ref }}

jobs:
  release:
    name: Version or release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Opens or updates a "Version Packages" PR while changesets are pending.
      # When that PR merges there are none left, and this releases.
      #
      # Publishing to npm is opt-in: set the repository variable
      # PUBLISH_TO_NPM=true and add an NPM_TOKEN secret. Without them the repo
      # still gets versions, a CHANGELOG and git tags, which is all a git
      # dependency needs. See docs/RELEASING.md.
      - name: Changesets
        id: changesets
        uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: ${{ vars.PUBLISH_TO_NPM == 'true' && 'npx changeset publish' || '' }}
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Without a publish step nothing tags the release, and a git dependency
      # pinned by semver range needs tags to resolve.
      - name: Tag release
        if: ${{ steps.changesets.outputs.hasChangesets == 'false' && vars.PUBLISH_TO_NPM != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npx changeset tag
          git push --follow-tags
